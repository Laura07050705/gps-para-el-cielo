<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS PARA EL CIELO</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      color: #1f2937;
    }

    header {
      background: #0b4f8a;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
      font-size: 16px;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0b4f8a;
      margin-top: 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>GPS PARA EL CIELO</h1>
    <p>Busca • Ora • Visita • Ama • Alcanza</p>
  </header>

  <main>
    <div class="card">
      <h2>Mi Vecindario</h2>
      <button onclick="mostrarVecindario()">Abrir Vecindario</button>
    <div id="vecindario" style="display:none;"> 
      <h2>Vecindario</h2>
      <p>Aquí aparecerá tu vecindario.</p>
      <input type="text" id="direccion" placeholder="Escribe una dirección">
      <button onclick="buscarDireccion()">Buscar</button>
</div>

    <div class="card">
      <h2>Lista de Oración</h2>
    </div>

    <div class="card">
      <h2>Seguimiento</h2>
    </div>

    <div class="card">
      <h2>Mi Perfil</h2>
    </div>
  </main>
<script>  
 function mostrarVecindario() {
   document.getElementById("vecindario").style.display = "block";
   }
  console.log("GPS PARA EL CIELO listo");
function buscarDireccion() {
  const direccion = document.getElementById("direccion").value;
  document.getElementById("vecindario").innerHTML += "<p>Buscando vecinos cerca de: " + direccion + "</p>";
  const url = "https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(direccion);
  fetch(url)
  .then(response => response.json())
  .then(data => {
    if (data.length > 0) {
      const lat = data[0].lat;
      const lon = data[0].lon;
      document.getElementById("vecindario").innerHTML += "<p>Ubicación encontrada: " + lat + ", " + lon + "</p>";
      document.getElementById("vecindario").innerHTML += '<p><a href="https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=17/' + lat + '/' + lon + '" target="_blank">Ver ubicación en el mapa</a></p>';
      document.getElementById("vecindario").innerHTML += '<iframe width="100%" height="350" style="border:0;" src="https://www.openstreetmap.org/export/embed.html?bbox=' + (parseFloat(lon)-0.01) + ',' + (parseFloat(lat)-0.01) + ',' + (parseFloat(lon)+0.01) + ',' + (parseFloat(lat)+0.01) + '&layer=mapnik&marker=' + lat + ',' + lon + '"></iframe>';
} else {
      document.getElementById("vecindario").innerHTML += "<p>No se encontró la dirección.</p>";
}
  });
}
  
</script>
</body>
</html>
